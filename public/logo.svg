<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#070810"/>
  <rect x="16" y="16" width="480" height="480" rx="80" fill="none" stroke="url(#border-grad)" stroke-width="2"/>
  <defs>
    <linearGradient id="border-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <!-- Crown/arrow accent above Y -->
  <path d="M200 148 L218 128 L236 148" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="218" cy="124" r="3" fill="#F59E0B"/>
  <!-- Y letter -->
  <text x="218" y="310" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="200" font-weight="700" fill="#6366F1" letter-spacing="-8">Y</text>
  <!-- W letter -->
  <text x="340" y="310" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="200" font-weight="700" fill="#818CF8" letter-spacing="-8">W</text>
  <!-- Subtle bottom accent line -->
  <line x1="140" y1="340" x2="380" y2="340" stroke="url(#border-grad)" stroke-width="3" stroke-linecap="round"/>
</svg>
