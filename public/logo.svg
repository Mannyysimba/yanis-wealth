<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: 22% corner radius -->
  <rect width="512" height="512" rx="113" fill="#070810"/>

  <!-- Hexagonal shield outline -->
  <path d="M256 100 L366 153 L366 310 L256 386 L146 310 L146 153 Z"
    fill="none" stroke="#6366F1" stroke-width="14" stroke-linejoin="round"/>

  <!-- Chart grid lines — subtle depth -->
  <line x1="174" y1="328" x2="338" y2="328" stroke="#6366F1" stroke-width="2.5" stroke-opacity="0.2"/>
  <line x1="174" y1="288" x2="338" y2="288" stroke="#6366F1" stroke-width="2.5" stroke-opacity="0.2"/>
  <line x1="174" y1="248" x2="338" y2="248" stroke="#6366F1" stroke-width="2.5" stroke-opacity="0.2"/>
  <line x1="174" y1="208" x2="338" y2="208" stroke="#6366F1" stroke-width="2.5" stroke-opacity="0.2"/>

  <!-- Upward trending chart line — bold, reads at any size -->
  <polyline points="182,316 228,272 288,244 338,168"
    fill="none" stroke="#6366F1" stroke-width="18"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Gold arrowhead tip — single clean chevron -->
  <path d="M322,192 L338,168 L354,178"
    fill="none" stroke="#F59E0B" stroke-width="14"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
